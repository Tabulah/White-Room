[package]
name = "white-room"
version = "0.1.0"
description = "A local-first learning and focus environment for macOS"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
# Separate library name avoids a name clash with the binary on some platforms.
name = "white_room_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Bundled SQLite gives a known, modern SQLite version (STRICT tables etc.)
# independent of the version shipped with macOS.
rusqlite = { version = "0.41", features = ["bundled"] }
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# AppKit, Foundation, and UserNotifications bindings for `platform`. Tauri
# already builds these crates; they are listed here so platform code can call
# them directly. Every call used is safe Rust (`unsafe` stays forbidden).
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSCalendar", "NSError", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
