name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, and build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend format
        run: npm run format:check

      - name: Frontend type check
        run: npm run check

      - name: Frontend tests
        run: npm test

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build app bundle (ad-hoc signed)
        run: npm run tauri -- build --debug --bundles app

      # macOS refuses notifications, without asking the user, to an app whose
      # code signature names a different identifier than its bundle.
      - name: Check the app is signed as itself
        run: |
          app="src-tauri/target/debug/bundle/macos/WHITE ROOM.app"
          codesign --verify --strict "$app"
          signed_as="$(codesign -dv "$app" 2>&1 | sed -n 's/^Identifier=//p')"
          echo "signed as: $signed_as"
          test "$signed_as" = "com.whiteroom.desktop"

      # Launches the built app, which migrates its database, then enters and
      # leaves the fullscreen workspace three times and checks the window is
      # restored each time (src-tauri/src/core/smoke_test.rs).
      - name: Smoke test (launch, enter and leave the workspace)
        timeout-minutes: 5
        env:
          WHITE_ROOM_SMOKE_TEST: '1'
        run: '"src-tauri/target/debug/bundle/macos/WHITE ROOM.app/Contents/MacOS/white-room"'

      - name: Crash test (kill the app inside the workspace; Dock and menu bar must come back)
        timeout-minutes: 5
        run: scripts/crash-test.sh

      - name: Collect app log
        if: failure()
        run: cp -R ~/Library/Logs/com.whiteroom.desktop app-log || true

      - name: Upload app log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-log
          path: app-log/
          if-no-files-found: ignore
